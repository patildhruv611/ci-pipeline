
import unittest
from unittest.mock import patch
from io import StringIO

from multiplication_table import multiplication_table


class TestMultiplicationTable(unittest.TestCase):

    @patch("sys.stdout", new_callable=StringIO)
    def test_table_of_5(self, mock_output):
        multiplication_table(5, 3)

        expected = (
            "5 x 1 = 5\n"
            "5 x 2 = 10\n"
            "5 x 3 = 15\n"
        )
        self.assertEqual(mock_output.getvalue(), expected)

    @patch("sys.stdout", new_callable=StringIO)
    def test_table_of_0(self, mock_output):
        multiplication_table(0, 2)

        expected = "0 x 1 = 0\n0 x 2 = 0\n"
        self.assertEqual(mock_output.getvalue(), expected)

    @patch("sys.stdout", new_callable=StringIO)
    def test_negative_number(self, mock_output):
        multiplication_table(-2, 2)

        expected = "-2 x 1 = -2\n-2 x 2 = -4\n"
        self.assertEqual(mock_output.getvalue(), expected)


if __name__ == "__main__":
    unittest.main()
